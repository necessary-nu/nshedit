[workspace]
resolver = "3"
members = ["crates/nshedit", "crates/nshedit-abi", "crates/nshedit-plat", "crates/nshterm"]

[workspace.package]
version = "0.0.0"
edition = "2024"
# The floor for everything except the ABI crate, and the same value nshterm
# already declared for itself: edition 2024, nothing newer.
#
# `crates/nshedit-abi` needs 1.99 for `c_variadic` and declares that itself.
# Carrying its requirement up here made the whole workspace unbuildable on
# stable, which locked out consumers of the *library* -- the Rust port of dash
# uses `nshedit` directly and needs none of the C ABI or its varargs.
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/necessary-nu/libedit"
authors = ["Brendan Molloy <brendan@necessary.nu>"]

[workspace.dependencies]
nshedit = { path = "crates/nshedit", version = "0.0.0" }
# The only crate that issues a syscall. See plan/decisions/platform-layer.md.
nshedit-plat = { path = "crates/nshedit-plat", version = "0.0.0" }
# See plan/decisions/terminal-caps-via-term-crate.md.
nshterm = { path = "crates/nshterm", version = "0.1.0" }

[profile.release]
lto = true
