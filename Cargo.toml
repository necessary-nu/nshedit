[workspace]
resolver = "3"
members = ["crates/nshedit", "crates/nshedit-abi", "crates/nshterm"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
repository = "https://github.com/necessary-nu/libedit"
authors = ["Brendan Molloy <brendan@necessary.nu>"]

[workspace.dependencies]
nshedit = { path = "crates/nshedit", version = "0.0.0" }
# See plan/decisions/terminal-caps-via-term-crate.md.
nshterm = { path = "crates/nshterm", version = "0.1.0" }

[profile.release]
lto = true
