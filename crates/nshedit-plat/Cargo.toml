[package]
name = "nshedit-plat"
description = "Safe operating-system access for nshedit terminal sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[target.'cfg(unix)'.dependencies]
# See plan/decisions/platform-layer.md. Licence: rustix is
# "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT" and we take the MIT
# or the plain Apache-2.0 arm, never the LLVM-exception one. Transitively on
# Linux it is exactly linux-raw-sys (same triple) and bitflags
# (MIT OR Apache-2.0). Nothing in that tree is WTFPL.
#
# On x86_64 and aarch64 Linux rustix selects its linux_raw backend and issues
# syscalls directly. Darwin intentionally selects rustix's libc backend, so
# the locked libc and errno target dependencies are compiled on macOS.
rustix = { version = "1.1", default-features = false, features = ["std", "termios", "process", "fs"] }

[target.'cfg(unix)'.dev-dependencies]
# The termios tests need a terminal to talk to, and must not need the one the
# test runner was started from: `cargo test` is routinely run with its standard
# input on a pipe, and a test that reconfigured the developer's own tty would
# be worse than one that skipped. So they allocate a pseudo-terminal, which
# needs rustix's `pty`. Cargo does not consider dev-dependencies when building
# the library, so the shipped artifact still links exactly the features above.
rustix = { version = "1.1", default-features = false, features = ["pty"] }

[lints]
workspace = true
