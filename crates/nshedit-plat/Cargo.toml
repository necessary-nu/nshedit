[package]
name = "nshedit-plat"
description = "The only crate in the workspace that issues a syscall: termios, window size, descriptor flags, the uid/gid queries, signals and the passwd database"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
# See plan/decisions/platform-layer.md. Licence: rustix is
# "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT" and we take the MIT
# or the plain Apache-2.0 arm, never the LLVM-exception one. Transitively on
# Linux it is exactly linux-raw-sys (same triple) and bitflags
# (MIT OR Apache-2.0). Nothing in that tree is WTFPL.
#
# On x86_64 and aarch64 Linux rustix selects its linux_raw backend and issues
# syscalls directly, so none of this goes near a libc. Cargo.lock still names
# libc and errno because they are non-optional in rustix's libc-backend
# target block; they are never compiled for our targets.
rustix = { version = "1.1", default-features = false, features = ["std", "termios", "process", "fs"] }
