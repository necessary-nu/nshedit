[package]
name = "nshedit-abi"
description = "The libedit and readline C ABIs, exported from nshedit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# Builds as libnshedit.so / libnshedit.a — one real artifact, carrying SONAME
# libnshedit.so.0 (see build.rs). The compatibility names are symlinks onto it,
# laid down by packaging/install.sh; libreadline.so.8 is deliberately NOT among
# them, at 149 of its 736 symbols. See `abi-soname` in plan/main.styx.
#
# Both the libedit and the readline surface are exported from this one object,
# which is what libedit itself already does. See plan/decisions/no-c-ffi.md.
#
# No `rlib`: the core crate already produces libnshedit.rlib, and two targets
# cannot write the same filename.
name = "nshedit"
crate-type = ["cdylib", "staticlib"]

[dependencies]
nshedit = { workspace = true, features = ["bsd"] }
nshedit-plat.workspace = true

[dev-dependencies]
# Generates the shipped headers, `include/histedit.h` and
# `include/editline/readline.h`, from the Rust in this crate — see
# `cbindgen/generate.rs`. The headers are generated and COMMITTED, so nothing
# consuming or packaging this library needs cbindgen, or cargo, or Rust: a
# `dev-dependency` is exactly the scope of "the people who regenerate them".
#
# A dependency rather than something to `cargo install`, so the version is
# pinned by Cargo.lock and the same bytes come out on every machine, and so
# `tests/headers.rs` can prove the committed copies are current without
# anyone having remembered to install a tool.
cbindgen = "0.29"
