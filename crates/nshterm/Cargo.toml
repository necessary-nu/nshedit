[package]
name = "nshterm"
version = "0.1.0"
edition = "2024"
# NOT the workspace's BSD-3-Clause. This crate derives from `term` 1.2.1,
# which is MIT OR Apache-2.0, copyright The Rust Project Developers.
license = "MIT OR Apache-2.0"
description = "Reads the terminfo database: capability lookup and parameterised string expansion, without linking a C library."
repository = "https://github.com/necessary-nu/nshedit"
authors = ["The Rust Project Developers", "Brendan Molloy <brendan@necessary.nu>"]
keywords = ["terminfo", "terminal", "termcap", "tty"]
categories = ["command-line-interface", "parser-implementations"]

[dependencies]
nshedit-plat.workspace = true

[lints]
workspace = true
