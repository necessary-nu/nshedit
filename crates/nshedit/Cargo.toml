[package]
name = "nshedit"
description = "Line editing, history and tokenization for nsh — a Rust re-implementation of libedit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
bsd = { version = "0.12.2", path = "../../../../work/libbsd/crates/bsd", optional = true }
bstr = { version = "1.13.0", default-features = false, features = ["std"] }
nshedit-plat.workspace = true
nshterm.workspace = true
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

[features]
default = ["bsd"]

# vis(3)/unvis(3), from the sibling `bsd` port rather than our own copies.
#
# On by default because it is what lets us READ the history files people
# already have — a `_HiStOrY_V2_` file is vis-encoded, and without a decoder
# we would have to tell those users their history is gone. Turning it off
# gives a build that reads and writes only the native format.
#
# Reading costs nothing against `dec:libedit:no-c-ffi`: `bsd::vis::decode` is
# a byte state machine with no libc in it. `bsd::vis::encode` is the half that
# calls `isgraph`/`mbtowc`/`wctomb`, and that is only reached when WRITING a
# libedit-format file. See `bsd-feature` in plan/main.styx.
bsd = ["dep:bsd"]
