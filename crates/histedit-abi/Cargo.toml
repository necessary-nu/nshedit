[package]
name = "histedit-abi"
description = "The libedit C ABI, exported from histedit so it drops in for the C library"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# The installed artifact must be libedit.so.0.0.78 with a matching soname,
# per LT_VERSION 0:78:0 in configure.ac — the crate name is unconstrained
# because the file name is what consumers link against.
name = "edit"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
histedit.workspace = true
