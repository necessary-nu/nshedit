# Pinned, not floating, and temporary.
#
# `c_variadic` is stable as of 1.99 — the compiler says so itself rather than
# gating it — but 1.99 has not shipped: stable is 1.97, beta 1.98. The ABI
# crate needs it so `el_set`, `el_get` and `history` can be declared variadic
# the way `histedit.h` declares them. The fixed-arity shim they replace is
# correct on x86-64 SysV and aarch64 AAPCS and *wrong* on aarch64 Apple, where
# variadic arguments go on the stack — caller and callee disagreeing about
# where an argument lives, which corrupts silently instead of failing to link.
#
# Delete this file when 1.99 reaches stable and move `rust-version` with it.
# See plan node `abi-varargs`.
[toolchain]
channel = "nightly-2026-07-30"
components = ["rustfmt", "clippy"]
